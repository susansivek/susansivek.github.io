title: Susan Currie Sivek
description: Writing, editing, and content portfolio
author: Susan Currie Sivek
email: susan.sivek@gmail.com

plugins:
  - jekyll-paginate

paginate: 15
paginate_path: "/page:num/"

permalink: /:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - README.md
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
  - duplicate-posts-report.md
  - image-recovery-report.json
  - image-recovery-pass2.json
  - image-recovery-summary.md
  - broken-images-report.json
  - broken-images-report.md
  - _plugins


title: Susan Currie Sivek
description: Writing, editing, and content portfolio
author: Susan Currie Sivek
email: susan.sivek@gmail.com

remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-paginate

show_downloads: false

paginate: 15
paginate_path: "/page:num/"

permalink: /:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

collections:
  posts:
    output: true

exclude:
  - README.md

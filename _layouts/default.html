<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="site">
    <header class="masthead">
      <p class="masthead-brand">
        <a href="{{ '/' | relative_url }}">Susan Currie Sivek</a>
      </p>
      <p class="masthead-tagline">
        Data science writer, researcher, hiker, knitter. Former journalism professor. Curious about everything.
        View <a href="https://www.linkedin.com/in/ssivek/">my LinkedIn profile</a>.
      </p>
      {% include nav.html %}
    </header>

    <main class="content" id="main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>&copy; {{ site.time | date: "%Y" }} {{ site.author }}</p>
      {% if site.email %}
      <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
      {% endif %}
    </footer>
  </div>
</body>
</html>
